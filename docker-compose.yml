version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aq_companies_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aq_companies_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aq_companies_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aq_companies_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aq_companies_prod?schema=public
      JWT_SECRET: production_jwt_secret_aq_companies_change_in_real_env
      JWT_REFRESH_SECRET: production_refresh_secret_aq_companies_change
      STORAGE_LOCAL_DIR: /app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aq_companies_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
